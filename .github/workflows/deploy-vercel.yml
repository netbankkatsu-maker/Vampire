name: Deploy to Vercel

on:
  push:
    branches:
      - claude/init-vampire-repo-UEyT0
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: |
          vercel --token=${{ secrets.VERCEL_TOKEN }} \
                 --yes \
                 --prod \
                 --name=dark-survivor
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Set MP_SERVER_URL env var on Vercel
        run: |
          echo "${{ secrets.RENDER_SERVER_URL }}" | \
          vercel env add MP_SERVER_URL production \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes 2>/dev/null || true
