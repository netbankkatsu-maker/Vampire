name: Deploy to Render

on:
  push:
    branches:
      - claude/init-vampire-repo-UEyT0
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Render deploy triggered"
